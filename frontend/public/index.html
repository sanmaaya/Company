<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeaveSync — Employee Leave Management</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sidebar-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-scrollbar::-webkit-scrollbar-thumb {
      background: #86efac;
      border-radius: 4px;
    }
  </style>
</head>

<body class="bg-gray-50">
  <div id="root"></div>
</body>

</html>
